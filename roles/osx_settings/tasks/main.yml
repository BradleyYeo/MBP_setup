---
- name: Configure macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ osx_settings_defaults }}"
  notify:
    - Restart SystemUIServer
    - Restart Finder

- name: Query current default browser
  ansible.builtin.command: defaultbrowser
  register: osx_settings_current_browser
  changed_when: false
  check_mode: false

- name: Set default browser
  ansible.builtin.command: "defaultbrowser {{ osx_settings_default_browser }}"
  when: ("* " ~ (osx_settings_default_browser | trim)) not in (osx_settings_current_browser.stdout_lines | map('trim') | list)
  changed_when: true
