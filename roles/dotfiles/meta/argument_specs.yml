---
argument_specs:
  main:
    short_description: Manage user dotfiles via Git bare repository
    description:
      - Clones and updates personal dotfiles bare repository and checks out tracked files into user home directory without symlinks.
    options:
      dotfiles_repo:
        type: str
        required: false
        description: URL of the remote dotfiles repository.
      dotfiles_repo_dir:
        type: path
        required: false
        description: Local bare repository directory path.
      dotfiles_home:
        type: path
        required: false
        description: Target work-tree directory where dotfiles are checked out.
      dotfiles_version:
        type: str
        required: false
        description: Git branch, tag, or commit to track.
