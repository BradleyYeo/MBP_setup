---
- name: Ensure Documents directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Documents"
    state: directory
    mode: "0700"

- name: Inspect existing repository destinations
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  register: clone_repos_dest_stat
  loop: "{{ clone_repos_github }}"

- name: Probe repository access for uninitialized repositories
  ansible.builtin.command:
    cmd: "git ls-remote --exit-code {{ item.item.repo }} HEAD"
  register: clone_repos_access_probe
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ clone_repos_dest_stat.results }}"
  when: not item.stat.exists

- name: Assert repository access and authentication are configured
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      Unable to access remote repository {{ item.item.item.repo }}.
      Ensure your Git credentials (via 'gh auth login' or SSH public key) are configured and authorized.
    success_msg: "Access verified for {{ item.item.item.repo }}"
  loop: "{{ clone_repos_access_probe.results }}"
  when:
    - clone_repos_access_probe is defined
    - item.skipped is not defined or not item.skipped

- name: Clone private repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.version | default('main') }}"
    update: false
  loop: "{{ clone_repos_github }}"
