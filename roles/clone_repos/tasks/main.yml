---
- name: Ensure Documents directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Documents"
    state: directory
    mode: "0700"

- name: Ensure repository parent directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: >-
    {{
      clone_repos_github
      | map(attribute='dest')
      | map('dirname')
      | reject('equalto', ansible_facts['user_dir'] ~ '/Documents')
      | unique
      | list
    }}

- name: Inspect existing repository destinations
  ansible.builtin.stat:
    path: "{{ item.dest }}"
  register: clone_repos_dest_stat
  loop: "{{ clone_repos_github }}"

- name: Verify GitHub CLI authentication status
  ansible.builtin.command:
    cmd: gh auth status
  register: clone_repos_gh_auth
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert GitHub credentials are configured
  ansible.builtin.assert:
    that:
      - clone_repos_gh_auth.rc == 0
    fail_msg: "GitHub CLI is not authenticated. Run 'gh auth login' to authenticate before cloning private repositories."
  when: clone_repos_dest_stat.results | rejectattr('stat.exists') | list | length > 0

- name: Clone private repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.version | default('main') }}"
    update: false
  loop: "{{ clone_repos_github }}"
