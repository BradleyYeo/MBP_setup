---
argument_specs:
  main:
    short_description: Clone Git workspace repositories
    description:
      - Clones personal and work Git repositories into local workspace directories.
    options:
      clone_repos_github:
        type: list
        elements: dict
        required: false
        description: List of repository entries containing repository URLs, local destinations, and branch versions.
        options:
          repo:
            type: str
            required: true
            description: Full Git clone URL (HTTPS or SSH) of the remote repository.
          dest:
            type: path
            required: true
            description: Target directory path where the repository should be cloned.
          version:
            type: str
            required: false
            default: main
            description: Target branch, tag, or commit to check out.
