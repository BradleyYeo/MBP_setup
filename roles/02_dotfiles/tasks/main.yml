---
- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dest }}"
    version: main
    update: false

- name: Inspect existing dotfile destinations
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
  register: dotfiles_stat
  loop: "{{ dotfiles_files }}"

- name: Create dotfile symlinks
  ansible.builtin.file:
    src: "{{ dotfiles_dest }}/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: link
    force: true
  loop: "{{ dotfiles_files }}"
