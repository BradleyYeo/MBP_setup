---
- name: Check if Brewfile dependencies are satisfied
  ansible.builtin.command:
    cmd: brew bundle check --file="{{ homebrew_brewfile }}" --no-upgrade
  register: homebrew_bundle_check
  changed_when: false
  failed_when: false
  check_mode: false
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  tags:
    - homebrew

- name: Install dependencies from Brewfile
  ansible.builtin.command:
    cmd: brew bundle install --file="{{ homebrew_brewfile }}" --no-upgrade
  when: homebrew_bundle_check.rc != 0
  changed_when: true
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  tags:
    - homebrew

- name: Update and upgrade all Homebrew packages
  community.general.homebrew:
    update_homebrew: true
    upgrade_all: true
  tags:
    - never
    - upgrade
